name: Bug
description: Something is broken
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: Include steps to reproduce }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ["severity:critical", "severity:high", "severity:medium", "severity:low"]
